plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/grupo6-ingsis/printscript2")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "7m" // maximum heap size
}

dependencies {
    testImplementation 'junit:junit:4.13.1'
    implementation 'org.gudelker:ast:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:lexer:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:parser:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:interpreter:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:formatter:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:analyzer:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:token:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:utilities:1.0.2-SNAPSHOT'
    implementation 'org.gudelker:cli:1.0.2-SNAPSHOT'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
